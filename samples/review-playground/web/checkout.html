<!DOCTYPE html>
<!-- A fixture for reviewing. The load order below is part of the exercise. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="dark-theme">

<main id="checkout">
    <section class="card">
        <h2 class="title">Your order</h2>
        <p class="muted">Prices include tax.</p>

        <table class="summary">
            <thead>
            <tr><th>Item</th><th>Qty</th><th>Price</th></tr>
            </thead>
            <tbody>
            <tr><td>Desk lamp</td><td>1</td><td>£24.00</td></tr>
            <tr><td>Notebook</td><td>3</td><td>£11.40</td></tr>
            </tbody>
        </table>
    </section>

    <section class="card" id="buy">
        <h2 class="title">Payment</h2>
        <p class="muted" style="color: #ffffff">Card ending 4242</p>
        <button class="btn">Pay now</button>
        <button class="btn" style="background: #444444">Cancel</button>
    </section>
</main>

</body>
</html>
